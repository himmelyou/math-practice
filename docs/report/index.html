<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var p = location.pathname;
      if (p.endsWith('/')) return;
      var segs = p.split('/').filter(Boolean);
      var last = segs[segs.length - 1];
      if (last === 'admin' || last === 'report') {
        location.replace(p + '/index.html' + location.search + location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>学员数据 · Jarvis Math Lab</title>
  <link rel="stylesheet" href="../shared/admin-shell.css" />
  <link rel="stylesheet" href="report-page.css?v=37" />
</head>
<body>
  <div id="report-gate-root"></div>

  <div id="report-app" class="jml-shell" hidden>
    <div class="jml-shell-inner jml-admin-wide">
      <div class="jml-admin-toolbar">
        <a class="jml-toolbar-link" href="../admin/index.html">后台管理</a>
        <button type="button" class="jml-btn" id="jml-cohort-rebuild-btn" title="全量重扫 runs 并写入四则+小数常模快照（与定时过期逻辑相同）">刷新全体常模</button>
        <button type="button" class="jml-btn jml-btn-warn" id="jml-backfill-run-speed-btn" title="临时：按 attempts 重算并写回 runs.json 中 training 的 runAvgSec（用后删除）">回填本局均速</button>
        <button type="button" class="jml-btn" onclick="AdminAuth.logout()">退出会话</button>
      </div>

      <h1>学员数据 <span id="jml-report-title-count" class="jml-report-title-count" aria-live="polite"></span></h1>
      <p class="muted">选择学员后查看挑战记录、错题本与数据分析；「学员概览」可一览全员进度。门禁通过后，会用同一口令作为请求头 <code>X-Admin-Pin</code> 调用 <code>/api/admin/*</code>。</p>

      <div id="jml-api-warning" class="jml-banner-warn" hidden>
        <strong>未配置 API 地址。</strong> 请确认已加载 <code>config.js</code>（与主站同目录），并且它能设置 <code>window.API_BASE_URL</code>（或 <code>window.__JML_API_BASE__</code>）。
      </div>

      <div id="jml-report-load-error" class="jml-report-error" style="display:none;"></div>

      <div class="jml-report-user-row">
        <label for="jml-report-user-filter">筛选</label>
        <input type="search" id="jml-report-user-filter" class="jml-report-user-filter" placeholder="输入用户名或备注…" autocomplete="off" />
        <span class="jml-report-user-scope-label">范围</span>
        <div class="jml-report-user-scope" role="group" aria-label="学员范围">
          <button type="button" class="jml-report-scope-btn active" data-scope="all">全部</button>
          <button type="button" class="jml-report-scope-btn" data-scope="vip">仅 VIP</button>
        </div>
        <span id="jml-report-user-scope-hint" class="jml-report-scope-hint" hidden aria-hidden="true"></span>
        <label for="jml-report-user-select">学员</label>
        <select id="jml-report-user-select" class="jml-report-user-select" aria-label="选择学员">
          <option value="">加载中…</option>
        </select>
        <button type="button" class="jml-btn" id="jml-report-refresh-student-btn" title="重新拉取当前学员最新记录" disabled>刷新</button>
      </div>
      <p class="jml-report-hint">学员概览支持顶部「全部 / 仅 VIP / 单个学员」筛选；挑战记录按时间降序。数据分析热图「推荐下一练」按该学员 runs 反推当日状态。排查选关不一致时用「训练选关Debug」Tab，复制 JSON 即可。</p>

      <div id="jml-report-student-error" class="jml-report-error" style="display:none;"></div>

      <div class="jml-tabs" role="tablist">
        <button type="button" class="jml-tab active" data-tab="overview" role="tab">学员概览</button>
        <button type="button" class="jml-tab" data-tab="runs" role="tab">挑战记录</button>
        <button type="button" class="jml-tab" data-tab="wrong" role="tab">错题本</button>
        <button type="button" class="jml-tab" data-tab="expand-wrong" role="tab">拆括号错题本</button>
        <button type="button" class="jml-tab" data-tab="stats" role="tab">数据分析</button>
        <button type="button" class="jml-tab" data-tab="train-debug" role="tab">训练选关Debug</button>
      </div>

      <div id="panel-overview" class="jml-tab-panel" data-panel="overview" role="tabpanel">
        <div id="jml-report-overview-body"></div>
      </div>
      <div id="panel-runs" class="jml-tab-panel hidden" data-panel="runs" role="tabpanel">
        <div id="jml-report-runs-body"></div>
      </div>
      <div id="panel-wrong" class="jml-tab-panel hidden" data-panel="wrong" role="tabpanel">
        <div id="jml-report-wrong-body"></div>
      </div>
      <div id="panel-expand-wrong" class="jml-tab-panel hidden" data-panel="expand-wrong" role="tabpanel">
        <div id="jml-report-expand-wrong-body"></div>
      </div>
      <div id="panel-stats" class="jml-tab-panel hidden" data-panel="stats" role="tabpanel">
        <div id="jml-report-stats-body"></div>
      </div>
      <div id="panel-train-debug" class="jml-tab-panel hidden" data-panel="train-debug" role="tabpanel">
        <div id="jml-report-train-debug-body"></div>
      </div>
    </div>
  </div>

  <script src="../config.js?v=21"></script>
  <script src="../shared/app-version.js?v=95"></script>
  <script>
    (function () {
      if (!window.__JML_API_BASE__ && window.API_BASE_URL) {
        window.__JML_API_BASE__ = window.API_BASE_URL;
      }
    })();
  </script>
  <script src="../shared/admin-auth.js?v=21"></script>
  <script src="../shared/stats-i18n-pack.js?v=70"></script>
  <script src="../stats-aggregate-browser.js?v=50"></script>
  <script src="../stats-heatmap-browser.js?v=68"></script>
  <script src="../stats-chart-browser.js?v=59"></script>
  <script src="report-page.js?v=56"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      AdminAuth.mount({
        gateId: 'report-gate-root',
        appId: 'report-app',
        title: '学员数据',
        blurb: '此页面用于查看学员挑战记录、错题与数据分析。请输入访问口令。',
        onUnlocked: function () {
          if (typeof JmlReportPage !== 'undefined') {
            JmlReportPage.init();
          }
        },
      });
    });
  </script>
</body>
</html>
